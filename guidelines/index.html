<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The 2025 BECE school-selection guidelines. Each rule shows the official wording, with a plain-language version you can open. Prototype.">
    <title>Guidelines &mdash; School Selection Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body data-page="guidelines" data-base="../">
    <div id="site-header"></div>

    <main id="main">
        <div class="page-header">
            <div class="container">
                <span class="page-eyebrow">2025 guidelines</span>
                <h1 class="page-title">Guidelines</h1>
                <p class="page-lead">
                    Read each rule in the official wording. Open <strong>In plain language</strong> for
                    a simpler version.
                </p>
                <p class="page-meta" id="guidelines-meta">&mdash;</p>
            </div>
        </div>

        <div class="guide-layout">
            <div class="container guide-container">
                <aside class="guide-sidebar">
                    <div id="guidelines-progress"></div>
                    <div id="guidelines-nav"></div>
                </aside>

                <div class="guide-main">
                    <section id="guidelines-summary" aria-labelledby="summary-heading"></section>
                    <div id="guidelines-content"></div>
                </div>
            </div>
        </div>

        <div class="guide-footer-cta">
            <div class="container guide-footer-inner">
                <p>
                    Ready to choose? You can return to any rule at any time.
                </p>
                <div class="guide-footer-actions">
                    <a class="btn btn-primary" href="../selection/index.html">Start school selection</a>
                    <a class="btn btn-outline" href="../index.html">Back to home</a>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <noscript>
        <p style="padding: 1rem; text-align: center; background: #fff3cd; color: #664d03;">
            This prototype loads the guidelines with JavaScript. Please enable it to read them.
        </p>
    </noscript>

    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/guidelines.js"></script>
</body>
</html>
